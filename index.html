<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas</title>

    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>

    <main>
        <h1>Sistema de Reservas</h1>
        <p>Reserva una mesa en nuestro restaurante</p>

        <h3>Mesas disponibles: <span id="disponibles">5</span></h3>

        <form id="form-reserva">

            <label for="nombre">Nombre del cliente:</label>
            <input type="text" id="nombre" required>

            <label for="mesas">Número de mesas:</label>
            <input type="number" id="mesas" min="1" required>

            <button type="submit" id="boton-reservar">
                Hacer reserva
            </button>

        </form>

        <p id="mensaje" role="status"></p>
    </main>

</body>
</html>
